name: closetimo
description: "옷장이모(Closetimo) — 큐레이팅하는 디지털 옷장"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Local NoSQL DB
  # 주 저장소는 SwiftPM을 지원하는 Isar Plus를 사용한다. 구형 Isar 3 저장소는
  # 전환 기간에만 local bridge와 고정 native plugin으로 읽는다.
  isar_plus: 1.3.7
  isar_plus_flutter_libs: 1.3.7
  isar_flutter_libs:
    path: packages/isar_flutter_libs
  closetimo_legacy_isar:
    path: packages/closetimo_legacy_isar

  # Image picker + path utilities
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # Internationalization
  intl: ^0.20.2

  # Immutable models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: 2.15.1
  # Isar Plus가 요구하는 analyzer 12와 호환되는 첫 Freezed 배포본이다.
  freezed: 3.2.6-dev.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/tips/

  # 폰트 파일은 OFL.txt와 함께 저장소에 커밋되어 있다 (assets/fonts/README.md).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard/Pretendard-Bold.otf
          weight: 700
